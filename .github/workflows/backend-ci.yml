
name: OZE Backend CI

on:
  push:
    branches:
      - develop
      - 'feat/**'
    paths:
      - 'oze-clinic-be/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'oze-clinic-be/**'
      - '.github/workflows/backend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'oze-clinic-be/OZE.sln'
  TEST_PROJECT: 'oze-clinic-be/OZE.UnitTest/OZE.UnitTest.csproj'

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test "${{ env.TEST_PROJECT }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=backend-tests.trx" \
            --results-directory "${{ github.workspace }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
