# Build, test and deploy the X-ray simulator (oze-xray-simulator) to its own Azure Web App.
# Needs the repository secret AZURE_SIMULATOR_PUBLISH_PROFILE (the web app's publish profile)
# and the variable AZURE_SIMULATOR_APP_NAME (the web app's name).

name: Build and deploy X-ray simulator to Azure Web App

on:
  push:
    branches:
      - 'main'
    paths:
      - 'oze-xray-simulator/**'
      - '.github/workflows/deploy_simulator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: oze-xray-simulator

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OZE.XRaySimulator.sln

      - name: Build
        run: dotnet build OZE.XRaySimulator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OZE.XRaySimulator.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/OZE.XRaySimulator/OZE.XRaySimulator.csproj -c Release -o ${{ github.workspace }}/simulator-app --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: ${{ github.workspace }}/simulator-app

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: simulator-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_SIMULATOR_APP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_SIMULATOR_PUBLISH_PROFILE }}
          package: .
