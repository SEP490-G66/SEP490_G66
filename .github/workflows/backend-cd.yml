
name: OZE Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'oze-clinic-be/**'
      - '.github/workflows/backend-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oze-backend-deployment
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  EF_CORE_VERSION: '10.0.15'
  IMAGE_NAME: ghcr.io/sep490-g66/oze-backend
  SOLUTION_PATH: oze-clinic-be/OZE.sln
  TEST_PROJECT: oze-clinic-be/OZE.UnitTest/OZE.UnitTest.csproj
  MIGRATION_PROJECT: oze-clinic-be/OZE.Persistence
  STARTUP_PROJECT: oze-clinic-be/OZE
  DB_CONTEXT: AppIdentityDbContext

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test "${{ env.TEST_PROJECT }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=backend-tests.trx" \
            --results-directory "${{ github.workspace }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Install EF Core CLI
        run: |
          dotnet tool install \
            --tool-path "$RUNNER_TEMP/ef-tools" \
            dotnet-ef \
            --version "${{ env.EF_CORE_VERSION }}"

          echo "$RUNNER_TEMP/ef-tools" >> "$GITHUB_PATH"

      - name: Build EF Core migration bundle
        run: |
          mkdir -p migration-bundle

          dotnet-ef migrations bundle \
            --project "${{ env.MIGRATION_PROJECT }}" \
            --startup-project "${{ env.STARTUP_PROJECT }}" \
            --context "${{ env.DB_CONTEXT }}" \
            --configuration Release \
            --self-contained \
            --target-runtime linux-x64 \
            --output "${{ github.workspace }}/migration-bundle/efbundle" \
            --force

      - name: Verify migration bundle
        run: |
          test -s migration-bundle/efbundle
          ls -lh migration-bundle/efbundle

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-bundle
          path: migration-bundle/efbundle
          retention-days: 3
          if-no-files-found: error

  publish-image:
    name: Build and Push Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./oze-clinic-be
          file: ./oze-clinic-be/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Migrate Database and Deploy Backend to VPS
    needs: publish-image
    if: github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-migration-bundle
          path: migration-bundle

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/oze_deploy
          chmod 600 ~/.ssh/oze_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload migration bundle to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/oze_deploy \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USERNAME@$VPS_HOST" \
            "mkdir -p /opt/oze/migrations/$IMAGE_TAG && chmod 700 /opt/oze/migrations/$IMAGE_TAG"

          scp \
            -i ~/.ssh/oze_deploy \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            migration-bundle/efbundle \
            "$VPS_USERNAME@$VPS_HOST:/opt/oze/migrations/$IMAGE_TAG/efbundle"

      - name: Backup, migrate and deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/oze_deploy \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$VPS_USERNAME@$VPS_HOST" \
            "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          exec 9>/opt/oze/.deployment.lock
          flock -w 300 9

          echo "Deployment lock acquired."

          cd /opt/oze/backend

          IMAGE_TAG="$1"

          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid image tag."
            exit 1
          fi

          NEW_IMAGE="ghcr.io/sep490-g66/oze-backend:${IMAGE_TAG}"
          OLD_IMAGE_ID=$(docker inspect -f '{{.Image}}' oze-backend)

          BUNDLE_DIR="/opt/oze/migrations/${IMAGE_TAG}"
          BUNDLE="${BUNDLE_DIR}/efbundle"

          test -s "$BUNDLE"
          test -x /opt/oze/scripts/backup-database.sh
          test -x /opt/oze/scripts/migrate-database.sh

          echo "Pulling new backend image..."
          docker pull "$NEW_IMAGE"

          docker tag "$OLD_IMAGE_ID" oze-backend:rollback

          persist_image() {
            python3 - "$1" <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          path = Path(".env")
          image = sys.argv[1]

          lines = path.read_text().splitlines()
          lines = [
              line for line in lines
              if not line.startswith("BACKEND_IMAGE=")
          ]

          lines.append(f"BACKEND_IMAGE={image}")

          fd, tmp = tempfile.mkstemp(dir=".")
          with os.fdopen(fd, "w") as f:
              f.write("\n".join(lines) + "\n")

          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PY
          }

          health_check() {
            for attempt in $(seq 1 30); do
              if curl -fsS \
                --max-time 5 \
                http://127.0.0.1:5000/api/services \
                > /dev/null; then
                return 0
              fi

              echo "Waiting for backend: attempt $attempt/30"
              sleep 5
            done

            return 1
          }

          rollback() {
            echo "Deployment failed. Rolling back backend image..."
            echo "WARNING: Database migrations are not rolled back."

            export BACKEND_IMAGE=oze-backend:rollback

            docker compose up -d \
              --no-build \
              --no-deps \
              --force-recreate \
              oze-backend || return 1

            persist_image "$BACKEND_IMAGE" || return 1

            if health_check; then
              echo "Backend image rollback successful."
            else
              echo "Rollback health check failed."
              return 1
            fi
          }

          echo "Creating database backup..."

          if ! /opt/oze/scripts/backup-database.sh; then
            echo "Database backup failed."
            echo "Deployment aborted."
            exit 1
          fi

          echo "Applying database migrations..."

          if ! /opt/oze/scripts/migrate-database.sh "$IMAGE_TAG"; then
            echo "Database migration failed."
            echo "Deployment aborted. Database inspection may be required."
            exit 1
          fi

          echo "Database migration completed."

          export BACKEND_IMAGE="$NEW_IMAGE"

          echo "Starting new backend container..."

          if ! docker compose up -d \
            --no-build \
            --no-deps \
            --force-recreate \
            oze-backend; then
            rollback || echo "Manual recovery required."
            exit 1
          fi

          echo "Checking backend health..."

          if ! health_check; then
            rollback || echo "Manual recovery required."
            exit 1
          fi

          if ! persist_image "$NEW_IMAGE"; then
            rollback || echo "Manual recovery required."
            exit 1
          fi

          docker compose ps

          echo "Cleaning up migration bundle..."

          rm -f "$BUNDLE"
          rmdir "$BUNDLE_DIR" || true

          echo "Backend deployment successful."
          echo "Deployed image: $NEW_IMAGE"

          REMOTE

      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/oze_deploy
